server {
    listen 80;
    server_name ptc.moosehq.lv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ptc.moosehq.lv;

    ssl_certificate     /etc/letsencrypt/live/ptc.moosehq.lv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptc.moosehq.lv/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Client max body
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2|css|js)$ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
