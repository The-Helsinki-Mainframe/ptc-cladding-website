<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — PTC Cladding</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=7" />
  <style>
    .notfound { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; background:#111; color:#fff; }
    .notfound__code { font-size:6rem; font-weight:900; color:var(--orange); line-height:1; margin-bottom:1rem; }
    .notfound__title { font-size:1.5rem; font-weight:600; margin-bottom:0.75rem; }
    .notfound__text { font-size:1rem; color:rgba(255,255,255,0.5); margin-bottom:2rem; }
    .notfound__btn { display:inline-block; padding:0.75rem 2rem; background:var(--orange); color:#fff; border-radius:4px; font-weight:600; text-decoration:none; transition:opacity 0.2s; }
    .notfound__btn:hover { opacity:0.85; }
  </style>
</head>
<body>
  <div class="notfound">
    <div class="notfound__code">404</div>
    <h1 class="notfound__title">Page not found</h1>
    <p class="notfound__text">This page doesn't exist or has been moved.</p>
    <a href="/" class="notfound__btn">Back to homepage</a>
  </div>
</body>
</html>
